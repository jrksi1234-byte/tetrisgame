<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris</title>
<style>
:root{--bg:#14102b;--panel:#201a45;--ink:#f4efff;--dim:#8d84c4;--line:#3a3270;--accent:#ffd23f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Press Start 2P","Courier New",monospace;display:flex;align-items:center;justify-content:center;padding:12px}
.cab{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
canvas{background:#0b0820;border:4px solid var(--line);border-radius:6px;max-width:100%}
.side{width:150px;display:flex;flex-direction:column;gap:12px;font-size:11px}
.box{background:var(--panel);border:2px solid var(--line);padding:10px;border-radius:6px}
.box b{display:block;color:var(--accent);font-size:16px;margin-top:6px}
.help{color:var(--dim);line-height:1.8;font-size:9px}
button{font:inherit;font-size:11px;background:var(--accent);border:0;padding:10px;border-radius:6px;cursor:pointer;color:#14102b}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(11,8,32,.85);font-size:22px;text-align:center}
#msg.show{display:flex}
#msg small{font-size:11px;color:var(--dim)}
.screen{position:relative}.screen:after{content:"";position:absolute;inset:4px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.pad{display:none;gap:6px;margin-top:8px}
@media (pointer:coarse){.pad{display:flex;flex-wrap:wrap;justify-content:center}.pad button{width:64px}}
</style>
</head>
<body>
<div class="cab">
  <div>
    <div class="screen"><canvas id="c" width="300" height="600"></canvas></div>
    <div class="pad">
      <button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">Rotate</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button data-k=" ">Drop</button>
    </div>
  </div>
  <div class="side">
    <div class="box">Hold (C)<canvas id="h" width="100" height="80" style="border:0;background:none;margin-top:6px"></canvas></div>
    <div class="box">Score<b id="score">0</b><span style="color:var(--dim);font-size:9px">Best <span id="best">0</span></span></div>
    <div class="box">Lines (goal 10)<b id="lines">0</b></div>
    <div class="box">Level<b id="level">1</b></div>
    <div class="box">Next<canvas id="n" width="100" height="80" style="border:0;background:none;margin-top:6px"></canvas></div>
    <div class="box help">←→ Move<br>↑ Rotate<br>↓ Soft drop<br>Space Hard drop<br>C Hold<br>P Pause<br>M Sound</div>
    <button id="restart">Restart</button>
  </div>
</div>
<div id="msg"><div id="mt"></div><small>Press Enter or click</small></div>
<script>
const W=10,H=20,S=30,GOAL=10;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const nv=document.getElementById('n'),nx=nv.getContext('2d');
const COL={I:'#33d6ff',O:'#ffd23f',T:'#b565ff',S:'#4cd964',Z:'#ff4d5e',J:'#4d79ff',L:'#ff9a3c'};
const SH={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
let board,cur,next,score,lines,level,over,won,paused,last,acc,bag=[],clearing=null,parts=[],pops=[],shake=0,combo=0,hold=null,canHold=true,title=true,best=0,ac,mute=false;
try{best=+localStorage.getItem('tb')||0}catch(e){}
const hx=document.getElementById('h').getContext('2d');
function saveBest(){try{localStorage.setItem('tb',best)}catch(e){}}
function tone(f,d,at,type,v){const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function sfx(k,n){if(mute)return;try{ac=ac||new AudioContext();
 if(k==='lock')tone(150,.08,0,'triangle',.08);
 else if(k==='clear'){for(let i=0;i<n+2;i++)tone(400+i*120,.12,i*.06)}
 else if(k==='level')[523,659,784,1047].forEach((f,i)=>tone(f,.15,i*.09));
 else if(k==='win')[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,i*.12));
 else if(k==='over')[300,220,160,100].forEach((f,i)=>tone(f,.25,i*.18,'sawtooth'))}catch(e){}}
function burst(x,y,col){for(let i=0;i<4;i++)parts.push({x:(x+.5)*S,y:(y+.5)*S,vx:(Math.random()-.5)*9,vy:-Math.random()*5-1,life:1,d:600+Math.random()*500,col,s:3+Math.random()*5})}
function confetti(){const c=Object.values(COL);for(let i=0;i<160;i++)parts.push({x:Math.random()*300,y:-10-Math.random()*200,vx:(Math.random()-.5)*3,vy:Math.random()*3+1,life:1,d:2800,col:c[i%c.length],s:5+Math.random()*4})}
function pop(text,col){pops.push({text,col,life:1})}
function hide(){document.getElementById('msg').classList.remove('show')}
function rnd(){if(!bag.length){bag=Object.keys(SH).sort(()=>Math.random()-.5)}return bag.pop()}
function mk(t){return{t,m:SH[t].map(r=>[...r]),x:0,y:0}}
function spawn(p){if(p){cur=p}else{cur=next||mk(rnd());next=mk(rnd());canHold=true}cur.x=Math.floor((W-cur.m[0].length)/2);cur.y=0;if(hit(cur.m,cur.x,cur.y)){over=true;saveBest();sfx('over');show('GAME OVER')}drawNext();drawHold()}
function doHold(){if(!canHold)return;const t=cur.t;if(hold){const p=mk(hold);hold=t;spawn(p)}else{hold=t;spawn()}canHold=false}
function hit(m,x,y){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){const nx=x+c,ny=y+r;if(nx<0||nx>=W||ny>=H||(ny>=0&&board[ny][nx]))return true}return false}
function rot(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function move(dx){if(!hit(cur.m,cur.x+dx,cur.y))cur.x+=dx}
function rotate(){const m=rot(cur.m);for(const k of [0,-1,1,-2,2])if(!hit(m,cur.x+k,cur.y)){cur.m=m;cur.x+=k;return}}
function lock(){cur.m.forEach((row,r)=>row.forEach((v,c)=>{if(v&&cur.y+r>=0)board[cur.y+r][cur.x+c]=cur.t}));
  const rows=[];for(let y=0;y<H;y++)if(board[y].every(v=>v))rows.push(y);
  sfx('lock');score+=10;ui();
  if(rows.length){clearing={rows,t:0};combo++;cur=null;shake=6+rows.length*4;sfx('clear',rows.length);
    rows.forEach(y=>{for(let x=0;x<W;x++)burst(x,y,COL[board[y][x]])});
    pop(['','Good!','Great!','Excellent!','TETRIS!!'][rows.length]+(combo>1?' Combo x'+combo:''),rows.length===4?'#ffd23f':'#ffffff')}
  else{combo=0;ui();spawn()}}
function finishClear(){const rows=clearing.rows,n=rows.length;clearing=null;
  for(let i=n-1;i>=0;i--)board.splice(rows[i],1);for(let i=0;i<n;i++)board.unshift(Array(W).fill(0));
  score+=[0,100,300,500,800][n]*level+(combo>1?50*combo:0);lines+=n;
  const nl=1+Math.floor(lines/3);if(nl>level){level=nl;pop('Level '+level+'!','#4cd964');sfx('level')}
  ui();if(lines>=GOAL){won=true;saveBest();sfx('win');confetti();show('🎉 YOU WIN!<br>'+GOAL+' lines cleared');return}
  spawn()}
function drop(){if(!hit(cur.m,cur.x,cur.y+1)){cur.y++;return true}lock();return false}
function hard(){let d=0;while(!hit(cur.m,cur.x,cur.y+1)){cur.y++;d++}lock()}
function ui(){if(score>best)best=score;score_.textContent=score;lines_.textContent=lines;level_.textContent=level;document.getElementById('best').textContent=best}
const score_=document.getElementById('score'),lines_=document.getElementById('lines'),level_=document.getElementById('level');
function show(t){document.getElementById('mt').innerHTML=t;document.getElementById('msg').classList.add('show')}
function cell(g,x,y,col,s){g.fillStyle=col;g.fillRect(x*s,y*s,s,s);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x*s,y*s,s,3);g.fillRect(x*s,y*s,3,s);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x*s,y*s+s-3,s,3);g.fillRect(x*s+s-3,y*s,3,s)}
function draw(){cx.save();cx.clearRect(0,0,300,600);if(shake>.3)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);cx.strokeStyle='#1a1540';cx.lineWidth=1;
  for(let i=1;i<W;i++){cx.beginPath();cx.moveTo(i*S,0);cx.lineTo(i*S,600);cx.stroke()}
  for(let i=1;i<H;i++){cx.beginPath();cx.moveTo(0,i*S);cx.lineTo(300,i*S);cx.stroke()}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(board[y][x])cell(cx,x,y,COL[board[y][x]],S);
  if(cur&&!over){let gy=cur.y;while(!hit(cur.m,cur.x,gy+1))gy++;
    cur.m.forEach((row,r)=>row.forEach((v,c)=>{if(v){cx.strokeStyle=COL[cur.t];cx.globalAlpha=.4;cx.strokeRect((cur.x+c)*S+2,(gy+r)*S+2,S-4,S-4);cx.globalAlpha=1}}));
    cur.m.forEach((row,r)=>row.forEach((v,c)=>{if(v)cell(cx,cur.x+c,cur.y+r,COL[cur.t],S)}))}drawFx();cx.restore()}
function drawMini(g,t){g.clearRect(0,0,100,80);if(!t)return;const m=SH[t],z=20,ox=(100-m[0].length*z)/2/z,oy=(80-m.length*z)/2/z;m.forEach((row,r)=>row.forEach((v,c)=>{if(v)cell(g,ox+c,oy+r,COL[t],z)}))}
function drawNext(){drawMini(nx,next.t)}
function drawHold(){drawMini(hx,hold)}
function drawFx(){
 if(clearing){const p=clearing.t/450,on=Math.floor(clearing.t/70)%2;clearing.rows.forEach(y=>{cx.fillStyle=on?'rgba(255,255,255,.95)':'rgba(255,255,255,.55)';cx.fillRect(0,y*S,300,S);cx.fillStyle='#0b0820';const w=150*p;cx.fillRect(0,y*S,w,S);cx.fillRect(300-w,y*S,w,S)})}
 parts.forEach(q=>{cx.globalAlpha=Math.max(0,Math.min(1,q.life));cx.fillStyle=q.col;cx.fillRect(q.x,q.y,q.s,q.s)});cx.globalAlpha=1;
 pops.forEach(o=>{cx.globalAlpha=Math.min(1,o.life*1.5);cx.font='bold 20px "Courier New",monospace';cx.textAlign='center';cx.strokeStyle='#0b0820';cx.lineWidth=5;const y=220-(1-o.life)*60;cx.strokeText(o.text,150,y);cx.fillStyle=o.col;cx.fillText(o.text,150,y)});cx.globalAlpha=1}
function loop(t){if(!last)last=t;const dt=Math.min(50,t-last);last=t;
  if(clearing){clearing.t+=dt;if(clearing.t>450)finishClear()}
  else if(!over&&!won&&!paused){acc+=dt;const sp=Math.max(80,700-(level-1)*70);if(acc>sp){acc=0;drop()}}
  parts.forEach(q=>{q.x+=q.vx*dt/16;q.y+=q.vy*dt/16;q.vy+=.15*dt/16;q.life-=dt/q.d});parts=parts.filter(q=>q.life>0);
  pops.forEach(o=>o.life-=dt/1100);pops=pops.filter(o=>o.life>0);shake*=.88;
  draw();requestAnimationFrame(loop)}
function start(){board=Array.from({length:H},()=>Array(W).fill(0));score=0;lines=0;level=1;over=won=paused=false;acc=0;next=null;bag=[];clearing=null;parts=[];pops=[];combo=0;hold=null;canHold=true;ui();document.getElementById('msg').classList.remove('show');spawn()}
function key(k){
  if(title){if(k==='Enter'||k===' '){title=false;paused=false;hide()}return}
  if(k==='m'||k==='M'){mute=!mute;return}
  if(over||won){if(k==='Enter')start();return}
  if(clearing)return;
  if(k==='p'||k==='P'){paused=!paused;paused?show('PAUSED'):document.getElementById('msg').classList.remove('show');return}
  if(paused)return;
  if(k==='ArrowLeft')move(-1);else if(k==='ArrowRight')move(1);else if(k==='ArrowUp')rotate();
  else if(k==='ArrowDown'){drop();acc=0}else if(k===' ')hard();else if(k==='c'||k==='C'||k==='Shift')doHold()}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();key(e.key)});
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();key(b.dataset.k)}));
document.getElementById('restart').onclick=start;
document.getElementById('msg').onclick=()=>{if(title)key('Enter');else if(over||won)start();else if(paused)key('p')};
start();paused=true;show('TETRIS');requestAnimationFrame(loop);
</script>
</body>
</html>
